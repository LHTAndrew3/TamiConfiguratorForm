<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAMI – 3D Viewer (embed)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    #viewer-3d {
      position: relative;
      width: 100%;
      height: 100%;
      background: #ffffff;
      cursor: grab;
    }

    #viewer-3d:active { cursor: grabbing; }

    #viewer-3d canvas { display: block; width: 100% !important; height: 100% !important; }

    #viewer-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 1;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div id="viewer-3d">
    <div id="viewer-loading">Loading 3D model…</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('viewer-3d');
    const loadingEl = document.getElementById('viewer-loading');

    // ── Scene / camera / renderer ──
    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(
      45,
      container.clientWidth / container.clientHeight,
      0.01,
      1000
    );
    camera.position.set(0.25, 0.15, 0.45);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // ── Lights ──
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const keyLight  = new THREE.DirectionalLight(0xffffff, 1.2); keyLight.position.set(2, 3, 2);  scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x99bbff, 0.5); fillLight.position.set(-2, 1, -1); scene.add(fillLight);

    // ── Orbit controls ──
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 0.15;
    controls.maxDistance = 1.2;
    controls.target.set(0, 0, 0);

    // ── Palettes (identical to index_exec.html) ──
    const FRAME_COLOURS = {
      'Black':    { color: 0x1a1a1a, metalness: 0.0,  roughness: 0.95 },
      'White':    { color: 0xf5f3ef, metalness: 0.1,  roughness: 0.55 },
      'Havana':   { color: 0x8a4a14, metalness: 0.05, roughness: 0.7, texture: 'havana' },
      'Burgundy': { color: 0x6b1424, metalness: 0.3,  roughness: 0.4  }
    };

    const LENS_COLOURS = {
      'Neutral':       { color: 0xb8b6b0, opacity: 0.55 },
      'Yellow':        { color: 0xeada6a, opacity: 0.55 },
      'Gradient Blue': { color: 0xaac4e0, opacity: 0.50 },
      'Gradient Grey': { color: 0x8a96a3, opacity: 0.55 }
    };

    const ARMS_DEFAULT = FRAME_COLOURS['Black'];

    // ── Procedural Havana texture ──
    let havanaTextureCache = null;
    function makeHavanaTexture() {
      if (havanaTextureCache) return havanaTextureCache;
      const SIZE = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = SIZE;
      const ctx = canvas.getContext('2d');

      const baseGrad = ctx.createLinearGradient(0, 0, SIZE, SIZE);
      baseGrad.addColorStop(0,   '#8a4a14');
      baseGrad.addColorStop(0.5, '#6e3a0f');
      baseGrad.addColorStop(1,   '#52280a');
      ctx.fillStyle = baseGrad;
      ctx.fillRect(0, 0, SIZE, SIZE);

      ctx.globalAlpha = 0.7;
      for (let i = 0; i < 22; i++) {
        const x = Math.random() * SIZE, y = Math.random() * SIZE;
        const r = 55 + Math.random() * 110;
        const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
        rg.addColorStop(0, '#e8a838');
        rg.addColorStop(0.5, '#c47d1aaa');
        rg.addColorStop(1, '#c47d1a00');
        ctx.fillStyle = rg;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      function drawBlob(cx, cy, baseRadius, color, vertices = 9) {
        ctx.beginPath();
        for (let i = 0; i <= vertices; i++) {
          const ang = (i / vertices) * Math.PI * 2;
          const r = baseRadius * (0.6 + Math.random() * 0.7);
          const x = cx + Math.cos(ang) * r;
          const y = cy + Math.sin(ang) * r;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
      }

      const darkPalette = ['#2a1505', '#3a1d08', '#1f0e02', '#4a2710'];
      ctx.filter = 'blur(2px)';
      for (let i = 0; i < 35; i++) {
        const x = Math.random() * SIZE, y = Math.random() * SIZE;
        const r = 35 + Math.random() * 70;
        const c = darkPalette[(Math.random() * darkPalette.length) | 0];
        ctx.globalAlpha = 0.85 + Math.random() * 0.15;
        drawBlob(x, y, r, c, 8 + Math.floor(Math.random() * 6));
      }
      for (let i = 0; i < 60; i++) {
        const x = Math.random() * SIZE, y = Math.random() * SIZE;
        const r = 8 + Math.random() * 20;
        const c = darkPalette[(Math.random() * darkPalette.length) | 0];
        ctx.globalAlpha = 0.7 + Math.random() * 0.3;
        drawBlob(x, y, r, c, 7);
      }
      ctx.filter = 'none';
      ctx.globalAlpha = 1;

      ctx.globalCompositeOperation = 'overlay';
      ctx.globalAlpha = 0.22;
      for (let i = 0; i < 18; i++) {
        const x = Math.random() * SIZE, y = Math.random() * SIZE;
        const r = 45 + Math.random() * 90;
        const rg = ctx.createRadialGradient(x, y, r * 0.4, x, y, r);
        rg.addColorStop(0, '#e8a83800');
        rg.addColorStop(0.7, '#e8a838');
        rg.addColorStop(1, '#e8a83800');
        ctx.fillStyle = rg;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1.5, 1.5);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      havanaTextureCache = tex;
      return tex;
    }

    // ── Mesh classification ──
    const LENS_NAME_HINTS       = ['lens', 'lente', 'lenti', 'glass'];
    const TEMPLE_TIP_NAME_HINTS = ['templetip', 'temple_tip', 'temple-tip', 'tip', 'punta', 'earpiece', 'ear_piece'];
    const ARM_NAME_HINTS        = ['arm', 'temple', 'asta', 'aste', 'leg', 'side'];
    const FRONT_NAME_HINTS      = ['front', 'frame', 'rim', 'bridge', 'frontal', 'frontale'];

    function classifyMesh(mesh, modelBBoxSize) {
      let p = mesh;
      while (p) {
        const pn = (p.name || '').toLowerCase();
        if (pn) {
          if (LENS_NAME_HINTS.some(h => pn.includes(h)))        return 'lens';
          if (TEMPLE_TIP_NAME_HINTS.some(h => pn.includes(h))) return 'templeTip';
          if (ARM_NAME_HINTS.some(h => pn.includes(h)))         return 'arm';
          if (FRONT_NAME_HINTS.some(h => pn.includes(h)))       return 'front';
        }
        p = p.parent;
      }
      const meshBox = new THREE.Box3().setFromObject(mesh);
      const meshSize = meshBox.getSize(new THREE.Vector3());
      const zRatio = meshSize.z / Math.max(modelBBoxSize.z, 1e-6);
      return zRatio > 0.55 ? 'arm' : 'front';
    }

    const frontMeshes     = [];
    const armMeshes       = [];
    const templeTipMeshes = [];
    const lensMeshes      = [];

    function ensureClonedMaterial(mesh) {
      if (!mesh.userData._matCloned) {
        mesh.material = mesh.material.clone();
        mesh.userData._matCloned = true;
      }
    }

    function paintMeshes(meshes, preset) {
      meshes.forEach(mesh => {
        ensureClonedMaterial(mesh);

        if (preset.texture === 'havana') {
          if (!mesh.material.isMeshStandardMaterial) {
            const old = mesh.material;
            mesh.material = new THREE.MeshStandardMaterial();
            old.dispose && old.dispose();
            mesh.userData._matCloned = true;
          }
          const geom = mesh.geometry;
          if (geom && !geom.attributes.uv) {
            geom.computeBoundingBox();
            const bb = geom.boundingBox;
            const sizeX = bb.max.x - bb.min.x || 1;
            const sizeY = bb.max.y - bb.min.y || 1;
            const pos = geom.attributes.position;
            const uvs = new Float32Array(pos.count * 2);
            for (let i = 0; i < pos.count; i++) {
              uvs[i * 2]     = (pos.getX(i) - bb.min.x) / sizeX;
              uvs[i * 2 + 1] = (pos.getY(i) - bb.min.y) / sizeY;
            }
            geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
          }
          mesh.material.map = makeHavanaTexture();
          mesh.material.color.setHex(0xffffff);
        } else {
          if (mesh.material.map) mesh.material.map = null;
          mesh.material.color.setHex(preset.color);
        }

        if ('metalness' in mesh.material) mesh.material.metalness = preset.metalness;
        if ('roughness' in mesh.material) mesh.material.roughness = preset.roughness;
        mesh.material.needsUpdate = true;
      });
    }

    function applyFrameColour(colourName) {
      const preset = FRAME_COLOURS[colourName];
      if (!preset) return;
      if (frontMeshes.length) paintMeshes(frontMeshes, preset);
      if (armMeshes.length) {
        const armPreset = colourName === 'White' ? FRAME_COLOURS['White'] : ARMS_DEFAULT;
        paintMeshes(armMeshes, armPreset);
      }
      if (templeTipMeshes.length) paintMeshes(templeTipMeshes, ARMS_DEFAULT);
    }

    function applyLensColour(lensName) {
      const preset = LENS_COLOURS[lensName];
      if (!preset || lensMeshes.length === 0) return;
      lensMeshes.forEach(mesh => {
        ensureClonedMaterial(mesh);
        mesh.material.color.setHex(preset.color);
        mesh.material.transparent = true;
        mesh.material.opacity = preset.opacity;
        if ('roughness' in mesh.material) mesh.material.roughness = 0.15;
        if ('metalness' in mesh.material) mesh.material.metalness = 0.0;
        mesh.material.needsUpdate = true;
      });
    }

    // ── Pending selections (applied as soon as the model finishes loading) ──
    let pendingColour = null;
    let pendingLens   = null;
    let modelReady    = false;

    // ── postMessage bridge (parent Wix ↔ iframe) ──
    // Accepted messages from parent:
    //   { type: 'setColour', value: 'Black' | 'White' | 'Havana' | 'Burgundy' }
    //   { type: 'setLens',   value: 'Neutral' | 'Yellow' | 'Gradient Blue' | 'Gradient Grey' }
    //   { type: 'resetView' }
    // Posted to parent:
    //   { type: 'viewerReady' }       — once initial render starts
    //   { type: 'modelLoaded' }       — once GLB has been parsed and added to scene
    //   { type: 'modelError', error } — if GLB fails to load
    window.addEventListener('message', (event) => {
      console.log('[viewer] raw message received:', event.data);

      // Wix sometimes wraps the payload — unwrap if necessary
      let data = event.data;
      if (data && typeof data === 'object' && data.data && typeof data.data === 'object' && data.data.type) {
        data = data.data;
      }
      if (!data || typeof data !== 'object') return;

      console.log('[viewer] processing:', data);

      switch (data.type) {
        case 'setColour':
          if (modelReady) applyFrameColour(data.value);
          else            pendingColour = data.value;
          break;
        case 'setLens':
          if (modelReady) applyLensColour(data.value);
          else            pendingLens = data.value;
          break;
        case 'resetView':
          camera.position.set(0.25, 0.15, 0.45);
          controls.target.set(0, 0, 0);
          controls.update();
          break;
      }
    });

    function postToParent(msg) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(msg, '*');
      }
    }

    // ── Load model ──
    // NOTE: when hosted on GitHub Pages, this path is resolved relative to viewer.html.
    const loader = new GLTFLoader();
    const modelUrl = 'blender/tami-glasses.gltf';

    loader.load(
      modelUrl,
      (gltf) => {
        const model = gltf.scene;

        const box    = new THREE.Box3().setFromObject(model);
        const size   = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);

        const maxDim = Math.max(size.x, size.y, size.z);
        const targetSize = 0.3;
        if (maxDim > 0) model.scale.setScalar(targetSize / maxDim);

        model.traverse(obj => {
          if (obj.isMesh) {
            const role = classifyMesh(obj, size);
            if      (role === 'arm')       armMeshes.push(obj);
            else if (role === 'templeTip') templeTipMeshes.push(obj);
            else if (role === 'lens')      lensMeshes.push(obj);
            else                           frontMeshes.push(obj);
          }
        });

        scene.add(model);
        loadingEl.style.display = 'none';
        modelReady = true;

        // Apply any selection that arrived before the model was ready
        if (pendingColour) applyFrameColour(pendingColour);
        if (pendingLens)   applyLensColour(pendingLens);

        postToParent({ type: 'modelLoaded' });
      },
      undefined,
      (err) => {
        console.error('GLB load failed:', err);
        loadingEl.innerHTML = 'Unable to load 3D model.';
        postToParent({ type: 'modelError', error: String(err) });
      }
    );

    // ── Resize ──
    function onResize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);

    // ── Render loop ──
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Signal to Wix that the viewer JS is up and listening
    postToParent({ type: 'viewerReady' });
  </script>

</body>
</html>
