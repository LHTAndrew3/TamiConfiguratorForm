[package]
name = "tami-configurator"
version = "1.0.0"
description = "TAMI Eyewear Configurator – LightHouse Tech"
authors = ["LightHouse Tech"]
edition = "2021"

[lib]
name = "tami_configurator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
